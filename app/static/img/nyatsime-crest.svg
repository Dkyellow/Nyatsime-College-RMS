<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0370b1"/>
      <stop offset="100%" stop-color="#025a8e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7C948"/>
      <stop offset="100%" stop-color="#E8A80C"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M100 8 L182 34 V112 C182 160 148 192 100 212 C52 192 18 160 18 112 V34 Z"
        fill="url(#shieldFill)" stroke="url(#goldGrad)" stroke-width="7"/>

  <!-- Inner gold keyline -->
  <path d="M100 22 L170 43 V111 C170 152 141 180 100 197 C59 180 30 152 30 111 V43 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>

  <!-- Open book -->
  <g>
    <!-- left page -->
    <path d="M98 118 C82 108 62 106 48 110 V146 C62 142 82 144 98 154 Z" fill="#FFFFFF"/>
    <path d="M102 118 C118 108 138 106 152 110 V146 C138 142 118 144 102 154 Z" fill="#F1F4FA"/>
    <!-- page lines -->
    <path d="M56 118 C70 115 84 117 94 122" stroke="#93A5C9" stroke-width="2" fill="none"/>
    <path d="M56 128 C70 125 84 127 94 132" stroke="#93A5C9" stroke-width="2" fill="none"/>
    <path d="M144 118 C130 115 116 117 106 122" stroke="#AAB9D6" stroke-width="2" fill="none"/>
    <path d="M144 128 C130 125 116 127 106 132" stroke="#AAB9D6" stroke-width="2" fill="none"/>
    <!-- book spine -->
    <rect x="97.5" y="112" width="5" height="46" rx="2" fill="#7A1F2B"/>
  </g>

  <!-- Torch flame above book -->
  <g>
    <path d="M100 44 C109 55 113 63 113 71 C113 81 107 88 100 88 C93 88 87 81 87 71 C87 63 91 55 100 44 Z"
          fill="url(#goldGrad)"/>
    <path d="M100 58 C104 64 106 68 106 72 C106 78 103 81 100 81 C97 81 94 78 94 72 C94 68 96 64 100 58 Z"
          fill="#FFF3D6"/>
    <rect x="95" y="92" width="10" height="16" rx="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Stars -->
  <g fill="url(#goldGrad)">
    <path d="M60 60 l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2-6.5-3.4-6.5 3.4 1.3-7.2-5.3-5.1 7.3-1 Z"/>
    <path d="M140 60 l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2-6.5-3.4-6.5 3.4 1.3-7.2-5.3-5.1 7.3-1 Z"/>
  </g>

  <!-- Motto ribbon -->
  <path d="M38 168 C60 178 140 178 162 168 L156 186 C136 195 64 195 44 186 Z"
        fill="url(#goldGrad)"/>
  <text x="100" y="183" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="11" font-weight="bold" fill="#025a8e" letter-spacing="1">NYATSIME</text>
</svg>
