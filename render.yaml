services:
  - type: web
    name: school-report-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: school-reports-db
          property: connectionString
      - key: PYTHONPATH
        value: .

databases:
  - name: school-reports-db
    plan: free
    databaseName: school_reports
